<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --surface-2: #f5f5f6;
  --line: #e4e4e7; --line-strong: #cfcfd4;
  --shadow: 0 1px 2px rgba(16,16,20,.05), 0 1px 1px rgba(16,16,20,.03);
  --ink: #111113;
  --ink-2: #4b4b52;
  --ink-3: #6f6f78;
  --accent: #d71920;
  --accent-ink: #ffffff;
  --on-accent: #ffffff;
  --accent-soft: #fbe2e3;
  --head: #0c0c0d;
  --head-ink: #ffffff;
  --ok: #1f8a4c;
  --ok-soft: #dcf1e4;
  --warn: #b26a00;
  --warn-soft: #fbebcc;
  --bad: #c62a2a;
  --bad-soft: #f8dcdc;
  --tire: #1c1c1f;
  --road: #dcdce0;
  --plate-blue: #1d3f9c;
  --f-display: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-brand: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0b; --surface: #141416; --surface-2: #1c1c1f; --line: #2b2b30; --line-strong: #3a3a41;
    --ink: #f0f0f2; --ink-2: #b0b0b8; --ink-3: #81818b;
    --accent: #e5282f; --accent-ink: #0b0b0c; --on-accent: #ffffff; --accent-soft: #3a1517;
    --head: #000000; --head-ink: #ffffff;
    --ok: #4cc17f; --ok-soft: #153324; --warn: #e7a43a; --warn-soft: #3a2a0d;
    --bad: #ff7676; --bad-soft: #3d1818;
    --tire: #050506; --road: #1f1f23; --plate-blue: #4a6ed6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0b; --surface: #141416; --surface-2: #1c1c1f; --line: #2b2b30; --line-strong: #3a3a41;
  --ink: #f0f0f2; --ink-2: #b0b0b8; --ink-3: #81818b;
  --accent: #e5282f; --accent-ink: #0b0b0c; --on-accent: #ffffff; --accent-soft: #3a1517;
  --head: #000000; --head-ink: #ffffff;
  --ok: #4cc17f; --ok-soft: #153324; --warn: #e7a43a; --warn-soft: #3a2a0d;
  --bad: #ff7676; --bad-soft: #3d1818;
  --tire: #050506; --road: #1f1f23; --plate-blue: #4a6ed6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding: 0 0 40px; -webkit-font-smoothing: antialiased;
}
.in { max-width: 1160px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.mono { font-family: var(--f-mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


/* barra superior */
.top { background: var(--head); color: var(--head-ink); border-bottom: 3px solid var(--accent); }
.top .in { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 10px; min-height: 58px; }
.brand { font-family: var(--f-brand); font-weight: 700; font-size: 26px; letter-spacing: .03em; display: flex; align-items: center; gap: 10px; line-height: 1; }
.brand svg.lock { height: 30px; width: auto; display: block; }
.brand svg.mark { width: 36px; height: 36px; }
.brand b { color: var(--accent); font-weight: 700; }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 13px; color: #b9b9c2; }
.who > span:first-child { padding-right: 12px; border-right: 1px solid #34343a; color: #e6e6ea; font-weight: 600; }
.who .mail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.who select { background: #1c1c1f; color: #fff; border: 1px solid #3a3a40; border-radius: 8px; padding: 6px 8px; max-width: 180px; }
.who .btn { background: transparent; color: #fff; border-color: #3a3a40; box-shadow: none; }
.who .btn:hover { background: #1f1f23; border-color: #55555d; }
.tabsbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 14px 14px 12px; font-weight: 600; font-size: 14px; color: var(--ink-3); cursor: pointer; white-space: nowrap; transition: color .15s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .pill { margin-left: 6px; padding: 1px 7px; font-size: 11.5px; }
main { max-width: 1160px; margin: 0 auto; padding: 28px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); }
.bottombar { display: none; }

/* pantalla de ingreso */
.login { max-width: 400px; margin: 9vh auto 0; padding-inline: 20px; }
.login .panel { padding: 28px; box-shadow: 0 8px 30px rgba(16,16,20,.08); border-top: 3px solid var(--accent); }
.login h1 { font-size: 26px; margin-bottom: 4px; }
.login .brand { justify-content: center; margin-bottom: 22px; font-size: 40px; color: var(--ink); }
.login .brand svg.lock { height: 56px; }
.login form { display: grid; gap: 12px; margin-top: 16px; }
.msg { padding: 10px 12px; border-radius: 8px; font-size: 14px; }
.msg.err { background: var(--bad-soft); color: var(--bad); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px 0; text-align: left; }
.spin { text-align: center; padding: 60px 0; color: var(--ink-3); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ro { background: var(--surface-2); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; color: var(--ink-2); }

/* celular: botones grandes, tarjetas en vez de tablas, barra de pestañas abajo */
@media (max-width: 720px) {
  body { padding-block-end: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .btn { padding: 11px 16px; min-height: 44px; }
  .btn.small { min-height: 38px; }
  .field input, .field select, .field textarea { padding: 11px 12px; font-size: 16px; }
  .head h1 { font-size: 24px; }
  .who .mail, .who .btn.out { display: none; }
  .who > span:first-child { border: 0; padding: 0; }
  main { padding-top: 20px; }
  .stat b { font-size: 24px; margin-top: 6px; }
  .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
  .stats .stat:last-child { grid-column: 1 / -1; }
  .stat { padding: 10px 12px; }
  .head .btn.primary { display: none; }
  .head { margin-bottom: 14px; }
  .brand svg.lock { height: 28px; }
  .who select { max-width: 140px; }
  .tabsbar { display: none; }
  .bottombar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--head); border-top: 3px solid var(--accent); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .bottombar button { flex: 1; background: none; border: 0; color: #a9a9b3; padding: 8px 2px; font-size: 11.5px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; position: relative; min-width: 0; }
  .bottombar button[aria-selected="true"] { color: #fff; }
  .bottombar button[aria-selected="true"] svg { color: var(--accent); }
  .bottombar svg { width: 22px; height: 22px; }
  .bottombar .pill { position: absolute; top: 0; right: 14%; font-size: 10px; padding: 1px 6px; }
  table.cards thead { display: none; }
  table.cards, table.cards tbody { display: block; }
  table.cards tr { display: block; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface); }
  table.cards tr.click:hover td { background: none; }
  table.cards td { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 6px 0; border: 0; text-align: right; }
  table.cards td::before { content: attr(data-l); color: var(--ink-3); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; text-align: left; flex: none; }
  table.cards td.nolabel::before { display: none; }
  table.cards td.nolabel { justify-content: flex-start; }
  table.cards td.empty { display: block; text-align: center; }
  table.cards td.empty::before { display: none; }
  .panel { padding: 14px; }
  .veh { gap: 14px; }
}
/* piezas comunes */
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { background: #b9141b; border-color: #b9141b; }
.btn.large { padding: 11px 20px; font-size: 15px; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.mute { background: var(--surface-2); color: var(--ink-2); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
.head h1 { font-size: 28px; line-height: 1.1; }
.head .label { margin-bottom: 4px; }

/* patente estilo Mercosur */
.plate { display: inline-flex; flex-direction: column; align-items: stretch; border: 1.5px solid #20262d; border-radius: 6px; background: #fff; color: #111; overflow: hidden; font-family: var(--f-display); font-weight: 700; line-height: 1; vertical-align: middle; }
.plate i { background: var(--plate-blue); color: #fff; font-style: normal; font-size: 8px; letter-spacing: .18em; text-align: center; padding: 2px 6px 1px; }
.plate b { font-size: 22px; letter-spacing: .08em; padding: 3px 10px 4px; text-align: center; }
.plate.sm b { font-size: 16px; padding: 2px 7px 3px; }
.plate.sm i { font-size: 6px; padding: 1px 4px; }

/* resumen */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 10px; padding: 13px 16px; box-shadow: var(--shadow); }
.stat .label { font-size: 11px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 650; font-size: 28px; line-height: 1; margin-top: 8px; font-variant-numeric: tabular-nums; }
.stat.bad { border-left-color: var(--bad); } .stat.warn { border-left-color: var(--warn); }
.stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }
.stat.zero b { color: var(--ink-3); }

/* estado vacío */
.blank { text-align: center; padding: 44px 20px 40px; max-width: 520px; margin: 0 auto; }
.blank .ic { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 16px; }
.blank .ic svg { width: 28px; height: 28px; }
.blank h2 { font-size: 22px; margin-bottom: 6px; }
.blank p { color: var(--ink-3); margin: 0 0 20px; }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 22px auto 0; text-align: left; display: grid; gap: 10px; max-width: 400px; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: baseline; color: var(--ink-2); font-size: 14px; }
.steps li::before { content: counter(s); flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-size: 12px; display: grid; place-items: center; color: var(--ink-2); }

/* tablas */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child { border-top-left-radius: 8px; } th:last-child { border-top-right-radius: 8px; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }

/* vista de vehículo */
.veh { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .veh { grid-template-columns: minmax(0, 1fr); } }
.diagram { background: var(--road); border-radius: 12px; padding: 12px 8px; }
.diagram svg { width: 100%; height: auto; display: block; max-width: 100%; }
.tirebtn { cursor: pointer; }
.tirebtn rect.t { stroke: var(--tire); stroke-width: 2.5; }
.tirebtn rect.vac { fill: var(--road); stroke: var(--ink-3); stroke-dasharray: 4 3; stroke-width: 2; }
.tirebtn:focus-visible { outline: none; }
.tirebtn:focus-visible rect.t { stroke: var(--ink); stroke-width: 5; }
.tirebtn:hover rect.t { stroke-width: 4; }
.tirebtn.sel rect.t { stroke: var(--ink); stroke-width: 5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 12px 0 0; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.wear { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin-top: 6px; }
.wear span { display: block; height: 100%; }
.timeline { list-style: none; margin: 14px 0 0; padding: 0; border-left: 2px solid var(--line); }
.timeline li { padding: 0 0 14px 16px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-3); }
.timeline li.i::before { border-color: var(--accent); }
.timeline li.e::before { border-color: var(--warn); }
.timeline .when { font-size: 12.5px; color: var(--ink-3); }

/* formularios */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.field input, .field select, .field textarea { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input::placeholder { color: #a4a4ad; }
.field.wide { grid-column: 1 / -1; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.sep { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; max-width: calc(100vw - 32px); }
.empty { padding: 36px 10px; text-align: center; color: var(--ink-3); }
.note { background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

/* selector de posiciones en Nueva venta */
.pick-grid { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 22px; align-items: start; margin-top: 10px; }
@media (max-width: 820px) { .pick-grid { grid-template-columns: minmax(0, 1fr); } }
.tirebtn.pick rect.t { fill: var(--surface); stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 4 3; transition: fill .12s; }
.tirebtn.pick.on rect.t { fill: var(--accent); fill-opacity: 1; stroke: var(--tire); stroke-dasharray: none; stroke-width: 2.5; }
.tirebtn.pick:hover rect.t { stroke: var(--accent); stroke-width: 3; }
.tirebtn.pick:focus-visible rect.t { stroke: var(--ink); stroke-width: 4; }
#poscount { font-size: 13px; margin-left: 4px; }

/* ingreso: negro, tonos suaves */
.spin { position: fixed; inset: 0; background: #0b0b0c; color: #8a8a93; display: grid; place-items: center; padding: 0; }
.lp { position: fixed; inset: 0; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 24px 0;
  background: radial-gradient(900px 420px at 50% -8%, #1b1b1f 0, #0b0b0c 62%); color: #e9e9ec; }
.lp .login { margin: 0; width: 100%; max-width: 400px; padding-inline: 20px; }
.lp .brand { color: #f2f2f3; margin-bottom: 26px; }
.lp .panel { background: #121214; border: 1px solid #232327; box-shadow: 0 24px 60px rgba(0,0,0,.55); color: #e9e9ec; padding: 30px 28px 24px; }
.lp h1 { color: #f2f2f3; font-weight: 600; letter-spacing: -.01em; }
.lp .muted { color: #8a8a93; }
.lp .field label { color: #a1a1aa; font-weight: 500; }
.lp .field input { background: #19191c; border-color: #2a2a2f; color: #f0f0f2; }
.lp .field input::placeholder { color: #5c5c65; }
.lp .field input:focus { border-color: #d71920; box-shadow: 0 0 0 3px rgba(215,25,32,.18); }
.lp input:-webkit-autofill { -webkit-text-fill-color: #f0f0f2; caret-color: #fff; box-shadow: 0 0 0 100px #19191c inset; transition: background-color 9999s; }
.lp .btn { background: #19191c; border-color: #2a2a2f; color: #e9e9ec; box-shadow: none; }
.lp .btn:hover { border-color: #55555d; }
.lp .btn.primary { background: #d71920; border-color: #d71920; color: #fff; margin-top: 4px; }
.lp .btn.primary:hover { background: #bd151b; border-color: #bd151b; }
.lp .msg.err { background: rgba(255,90,90,.1); color: #ff9c9c; }
.lp .msg.ok { background: rgba(76,193,127,.1); color: #6fd49c; }
.lp .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0 6px; color: #5c5c65; font-size: 12px; }
.lp .divider::before, .lp .divider::after { content: ""; flex: 1; height: 1px; background: #232327; }
.ghostlink { display: block; width: 100%; background: none; border: 0; padding: 10px 0; text-align: center; color: #8a8a93; font-size: 14.5px; cursor: pointer; transition: color .15s; }
.ghostlink:hover { color: #f2f2f3; }
.ghostlink i { font-style: italic; letter-spacing: .01em; }
.lp-foot { text-align: center; color: #55555d; font-size: 12px; margin: 22px 0 0; letter-spacing: .04em; }
.field label input[type=checkbox] { width: 18px; height: 18px; padding: 0; margin: 0 8px 0 0; vertical-align: -4px; accent-color: var(--accent); }
.field label:has(input[type=checkbox]) { display: flex; align-items: center; cursor: pointer; }

/* stock y autogestion */

.tirebtn.pv { cursor: default; }
.tid { display: inline-block; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; font-weight: 500; font-size: 12.5px; white-space: nowrap; }

/* cuantificador */

.ladron{display:grid;grid-template-columns:1fr 130px 110px;gap:10px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
@media(max-width:720px){.ladron{grid-template-columns:1fr 1fr}.ladron>div:first-child{grid-column:1/-1}}
.rep h2{margin:2px 0;font-size:24px}.rep-head{margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.kpi span{display:block;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:22px;margin-top:2px}.kpi small{color:var(--ink-3)}
.kpi.big{grid-column:1/-1;background:var(--head);color:var(--head-ink);border-color:var(--head)}.kpi.big span,.kpi.big small{color:#bbb}.kpi.big b{font-size:34px}
.split{display:flex;height:28px;border-radius:8px;overflow:hidden;margin-bottom:14px;background:var(--line)}

@media print{header.top,.tabsbar,.bottombar,.noprint,#toast{display:none!important}body{background:#fff}main{padding:0}.panel{border:0;box-shadow:none}}

.rtab{width:100%;border-collapse:collapse}.rtab th{text-align:left;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:1px solid var(--line)}
.rtab th.r,.rtab td.r{text-align:right}.rtab td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}.rtab td.r{white-space:nowrap;min-width:120px}

<body>
<div id="app"><div class="spin">Cargando…</div></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
window.TOPFLOTA_CONFIG = {
  url: 'https://ldghtlbtpuaxaxqquxaf.supabase.co',
  key: 'sb_publishable_wmA_nTiLi2Pe6Cr2HyhTzQ_wFxpKIap'
};
</script>
<script>
/* TOP Flota - nucleo: conexion, estado, utilidades y calculo de estado de cada cubierta */
const CFG = window.TOPFLOTA_CONFIG;
const sb = window.supabase.createClient(CFG.url, CFG.key);

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d, 12); };
const daysSince = s => Math.round((Date.now() - parse(s).getTime()) / 86400000);
const fmt = n => Math.round(n).toLocaleString('es-AR');
const mm = n => Number(n).toFixed(1).replace('.', ',');
const fdate = s => parse(s).toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' });
const num = v => (v === null || v === undefined || v === '' ? null : Number(v));
let tt;
function toast(m) { const e = $('#toast'); e.textContent = m; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => { e.hidden = true; }, 3200); }
const errTxt = e => (e && (e.message || e.error_description)) || 'Error inesperado';

/* ---------- catalogos ---------- */
const CONFIGS = [
  ['4x2', 'Camión 4x2'], ['6x2', 'Camión 6x2'], ['6x4', 'Camión / tractor 6x4'], ['8x4', 'Camión 8x4'],
  ['semi 2 ejes', 'Semirremolque 2 ejes'], ['semi 3 ejes', 'Semirremolque 3 ejes'],
  ['acoplado 2 ejes', 'Acoplado 2 ejes'], ['acoplado 3 ejes', 'Acoplado 3 ejes'], ['utilitario', 'Utilitario']
];
const LAYOUTS = { '4x2': 'SD', '6x2': 'SDD', '6x4': 'SDD', '8x4': 'SSDD', 'semi 2 ejes': 'DD', 'semi 3 ejes': 'DDD', 'acoplado 2 ejes': 'DD', 'acoplado 3 ejes': 'DDD', 'utilitario': 'SS' };
const TIPOS = [['tractor', 'Tractor'], ['camion', 'Camión'], ['semirremolque', 'Semirremolque'], ['acoplado', 'Acoplado'], ['utilitario', 'Utilitario'], ['colectivo', 'Colectivo'], ['maquinaria', 'Maquinaria']];
const TRABAJOS = ['ruta larga', 'mixto', 'urbano', 'forestal', 'granos', 'minero', 'combustible', 'petrolero'];
const MOTIVOS = [['desgaste', 'Desgaste'], ['rotacion', 'Rotación'], ['pinchadura', 'Pinchadura'], ['danio', 'Daño'], ['recapado', 'Recapado'], ['garantia', 'Garantía'], ['venta_vehiculo', 'Venta del vehículo'], ['otro', 'Otro']];
const ROLES = [['admin', 'Administrador'], ['vendedor', 'Vendedor'], ['tecnico', 'Técnico']];
const PSI_MIN = 90;   // presion considerada baja (ajustable)
const tipoLabel = t => (TIPOS.find(x => x[0] === t) || [0, t])[1];
const motivoLabel = m => (MOTIVOS.find(x => x[0] === m) || [0, m || ''])[1];
function axles(config) {
  return [...(LAYOUTS[config] || 'SD')].map((k, i) => {
    const n = i + 1;
    return k === 'S'
      ? { n, tires: [{ c: n + 'I', x: 70 }, { c: n + 'D', x: 256 }] }
      : { n, tires: [{ c: n + 'IE', x: 22 }, { c: n + 'II', x: 62 }, { c: n + 'DI', x: 264 }, { c: n + 'DE', x: 304 }] };
  });
}
const hasCab = v => ['camion', 'tractor', 'utilitario', 'colectivo'].includes(v.tipo);
const codesOf = config => axles(config).flatMap(a => a.tires.map(t => t.c));

/* ---------- estado de la app ---------- */
const S = {
  user: null, role: null, isAdmin: false, empresas: [], empId: null, members: [], access: [],
  d: { clientes: [], vehiculos: [], posiciones: [], cubiertas: [], instalaciones: [], inspecciones: [], eventos: [], invitaciones: [], relevamientos: [] },
  ix: {}, tab: 'flota', vehId: null, code: null, q: '', cli: '', trab: '', sq: '', sest: '', scli: '', xq: '', xmot: '', xcli: '', recapId: null, relId: null, delRel: null, delArm: null, msg: '', busy: false
};
const isStaff = () => S.role === 'staff';
const fmtId = c => (c.numero !== null && c.numero !== undefined ? 'TF-' + String(c.numero).padStart(5, '0') : (c.qr_codigo || '').slice(0, 6).toUpperCase());
function lastDepth(c) {
  const l = (S.ix.inspByCub && S.ix.inspByCub[c.id]) || [], x = [...l].reverse().find(i => i.profundidad_mm !== null && i.profundidad_mm !== undefined);
  const rec = S.d.eventos.filter(e => e.cubierta_id === c.id && e.tipo === 'recapado').sort((a, b) => ((a.creado_en || a.fecha) < (b.creado_en || b.fecha) ? 1 : -1))[0];
  // si volvió de un recapado después de la última medición, vale el dibujo recapado
  if (rec && (!x || (rec.creado_en || rec.fecha) > (x.creado_en || x.fecha))) return Number(c.profundidad_original_mm);
  return x ? Number(x.profundidad_mm) : Number(c.profundidad_original_mm);
}
const empresa = () => S.empresas.find(e => e.id === S.empId) || {};

async function fetchAll(table) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(table).select('*').order('id').range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
async function loadData() {
  const names = ['clientes', 'vehiculos', 'posiciones', 'cubiertas', 'instalaciones', 'inspecciones', 'eventos'];
  if (S.role === 'staff') names.push('invitaciones');
  const res = await Promise.all(names.map(fetchAll));
  S.d = { clientes: [], vehiculos: [], posiciones: [], cubiertas: [], instalaciones: [], inspecciones: [], eventos: [], invitaciones: [], relevamientos: [] };
  names.forEach((n, i) => { S.d[n] = res[i].filter(r => r.empresa_id === S.empId); });
  // el cuantificador es opcional: si todavia no se corrio su SQL, el resto de la app sigue funcionando
  try { S.d.relevamientos = (await fetchAll('relevamientos')).filter(r => r.empresa_id === S.empId); } catch (e) { S.d.relevamientos = []; }
  buildIndex();
}
function buildIndex() {
  const ix = { cli: {}, veh: {}, pos: {}, cub: {}, inst: {}, posByVeh: {}, activeByVeh: {}, activeByCub: {}, instByCub: {}, inspByInst: {}, vehByCli: {}, inspByCub: {} };
  S.d.clientes.forEach(c => { ix.cli[c.id] = c; });
  S.d.vehiculos.forEach(v => { ix.veh[v.id] = v; (ix.vehByCli[v.cliente_id] = ix.vehByCli[v.cliente_id] || []).push(v); });
  S.d.posiciones.forEach(p => { ix.pos[p.id] = p; (ix.posByVeh[p.vehiculo_id] = ix.posByVeh[p.vehiculo_id] || {})[p.codigo] = p; });
  S.d.cubiertas.forEach(c => { ix.cub[c.id] = c; });
  S.d.instalaciones.forEach(i => {
    ix.inst[i.id] = i;
    (ix.instByCub[i.cubierta_id] = ix.instByCub[i.cubierta_id] || []).push(i);
    if (!i.fecha_retiro) {
      (ix.activeByVeh[i.vehiculo_id] = ix.activeByVeh[i.vehiculo_id] || []).push(i);
      ix.activeByCub[i.cubierta_id] = i;
    }
  });
  S.d.inspecciones.forEach(x => { (ix.inspByInst[x.instalacion_id] = ix.inspByInst[x.instalacion_id] || []).push(x); (ix.inspByCub[x.cubierta_id] = ix.inspByCub[x.cubierta_id] || []).push(x); });
  Object.values(ix.inspByCub).forEach(l => l.sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.creado_en || '') < (b.creado_en || '') ? -1 : 1)));
  Object.values(ix.inspByInst).forEach(l => l.sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.creado_en || '') < (b.creado_en || '') ? -1 : 1)));
  S.ix = ix;
}
const activeAt = (v, code) => { const p = (S.ix.posByVeh[v.id] || {})[code]; return p ? (S.ix.activeByVeh[v.id] || []).find(i => i.posicion_id === p.id) : null; };

/* ---------- calculo de estado ---------- */
const ST = { ok: ['ok', 'En buen estado'], warn: ['warn', 'Próximo recambio'], bad: ['bad', 'Recambiar'] };
const RANK = { ok: 0, warn: 1, bad: 2 };
const worst = list => list.reduce((w, i) => (RANK[i.st] > RANK[w] ? i.st : w), 'ok');
function info(inst) {
  const e = empresa(), v = S.ix.veh[inst.vehiculo_id], c = S.ix.cub[inst.cubierta_id];
  const list = S.ix.inspByInst[inst.id] || [], last = list[list.length - 1];
  const min = Number(e.profundidad_minima_mm ?? 3), orig = Number(c.profundidad_original_mm);
  const depth = last ? (num(last.profundidad_mm) ?? orig) : orig;
  const recorridos = Math.max(0, v.km_actual - inst.km_vehiculo_instalacion);
  let rate = null, kmLeft = null;
  const first = list[0], d0 = first && num(first.profundidad_mm) !== null ? Number(first.profundidad_mm) : orig, km0 = first ? first.km_vehiculo : inst.km_vehiculo_instalacion;
  if (last && last.km_vehiculo > km0 && d0 > depth) {
    rate = (d0 - depth) / (last.km_vehiculo - km0) * 1000;
    kmLeft = Math.max(0, Math.round((depth - min) / rate * 1000));
  }
  const vencida = !last || daysSince(last.fecha) > (e.inspeccion_cada_dias ?? 30) || (v.km_actual - last.km_vehiculo) > (e.inspeccion_cada_km ?? 10000);
  let st = 'ok';
  if (last && depth <= min) st = 'bad';
  else if (last && ((kmLeft !== null && kmLeft < 25000) || depth - min < 2)) st = 'warn';
  const pct = Math.max(0, Math.min(1, (depth - min) / (orig - min || 1)));
  const psi = last ? num(last.presion_psi) : null;
  return { inst, v, c, last, depth, psi, recorridos, rate, kmLeft, vencida, st, pct, lowPsi: psi !== null && psi < PSI_MIN, code: S.ix.pos[inst.posicion_id].codigo };
}
const infoOfVeh = v => (S.ix.activeByVeh[v.id] || []).map(info);
function kmTotal(c) {
  return (S.ix.instByCub[c.id] || []).reduce((s, i) => s + Math.max(0, (i.km_vehiculo_retiro ?? S.ix.veh[i.vehiculo_id].km_actual) - i.km_vehiculo_instalacion), 0);
}
/* costo de la cubierta: compra + recapados (en la misma moneda) */
function costoTotal(c) {
  if (c.precio_venta === null || c.precio_venta === undefined || c.precio_venta === '') return null;
  const mon = c.moneda || 'USD';
  return Number(c.precio_venta) + S.d.eventos.filter(e => e.cubierta_id === c.id && e.tipo === 'recapado' && e.costo && (e.moneda || mon) === mon).reduce((s, e) => s + Number(e.costo), 0);
}
function alertList() {
  const out = [];
  S.d.instalaciones.filter(i => !i.fecha_retiro).forEach(inst => {
    const i = info(inst), motivos = [];
    if (i.st === 'bad') motivos.push(['bad', 'Recambiar ahora']);
    else if (i.st === 'warn') motivos.push(['warn', 'Recambio próximo']);
    if (i.vencida) motivos.push(['warn', 'Inspección vencida']);
    if (i.lowPsi) motivos.push(['warn', 'Presión baja']);
    if (motivos.length) out.push({ i, motivos });
  });
  return out.sort((a, b) => RANK[b.i.st] - RANK[a.i.st] || (a.i.kmLeft ?? 1e9) - (b.i.kmLeft ?? 1e9));
}

/* TOP Flota - ingreso, sesion e invitaciones */
const LOGO = '<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0c0c0d"/><circle cx="32" cy="32" r="22" fill="none" stroke="#d71920" stroke-width="9"/><circle cx="32" cy="32" r="22" fill="none" stroke="#0c0c0d" stroke-width="9" stroke-dasharray="2.2 6.439"/><path d="M22.5 23.5h19v6h-6.5v14.5h-6V29.5h-6.5z" fill="#ffffff"/></svg>';
const LOGO_FULL = '<svg class="lock" viewBox="0 0 406 64" role="img" aria-label="TOP Flota"><rect width="64" height="64" rx="14" fill="#0c0c0d"/><circle cx="32" cy="32" r="22" fill="none" stroke="#d71920" stroke-width="9"/><circle cx="32" cy="32" r="22" fill="none" stroke="#0c0c0d" stroke-width="9" stroke-dasharray="2.2 6.439"/><path d="M22.5 23.5h19v6h-6.5v14.5h-6V29.5h-6.5z" fill="#ffffff"/><g transform="translate(84 12) skewX(-8) translate(6 0)"><g transform="translate(0 0)"><path d="M0 4H32M16 0V40" fill="none" stroke="#d71920" stroke-width="8"/></g><g transform="translate(38 0)"><rect x="4" y="4" width="26" height="32" rx="11" fill="none" stroke="#d71920" stroke-width="8"/></g><g transform="translate(78 0)"><path d="M4 40V4H17C24 4 26 9 26 14.5C26 20 24 25 17 25H4" fill="none" stroke="#d71920" stroke-width="8"/></g><g transform="translate(126 0)"><path d="M4 40V4H28M4 22H24" fill="none" stroke="currentColor" stroke-width="8"/></g><g transform="translate(160 0)"><path d="M4 0V36H28" fill="none" stroke="currentColor" stroke-width="8"/></g><g transform="translate(194 0)"><rect x="4" y="4" width="26" height="32" rx="11" fill="none" stroke="currentColor" stroke-width="8"/></g><g transform="translate(234 0)"><path d="M0 4H32M16 0V40" fill="none" stroke="currentColor" stroke-width="8"/></g><g transform="translate(272 0)"><path d="M0 40L14.2 0H21.8L36 40H27.6L25.2 32.6H10.8L8.4 40ZM13.2 25.4H22.8L18 11.6Z" fill="currentColor" fill-rule="evenodd"/></g></g></svg>';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } };

function authErr(e) {
  const m = errTxt(e);
  if (/invalid login/i.test(m)) return 'Mail o contraseña incorrectos.';
  if (/not confirmed/i.test(m)) return 'Falta confirmar el mail. Revisá tu bandeja de entrada.';
  if (/already registered|already been registered/i.test(m)) return 'Ese mail ya tiene cuenta. Ingresá con tu contraseña.';
  if (/rate limit/i.test(m)) return 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';
  return m;
}
function showLogin(o = {}) {
  const mode = o.mode || 'in';
  $('#app').innerHTML = `<div class="lp"><div class="login"><div class="brand">${LOGO_FULL}</div>
    <div class="panel"><h1>${mode === 'in' ? 'Ingresar' : 'Crear cuenta'}</h1>
    <p class="muted" style="margin:0">${mode === 'in' ? 'Seguimiento de cubiertas por flota.' : 'Usá el mismo mail con el que te invitó TOP Neumáticos.'}</p>
    ${o.msg ? `<div class="msg ${o.msg.t}" style="margin-top:14px">${esc(o.msg.m)}</div>` : ''}
    <form id="authform" data-mode="${mode}">
      <div class="field"><label for="a-mail">Mail</label><input id="a-mail" type="email" autocomplete="email" required value="${esc(o.email || '')}"></div>
      <div class="field"><label for="a-pass">Contraseña</label><input id="a-pass" type="password" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}" minlength="8" required></div>
      <button class="btn primary" type="submit">${mode === 'in' ? 'Ingresar' : 'Crear cuenta'}</button>
    </form>
    <div class="divider"><span>o</span></div>
    <button class="ghostlink" data-act="authmode" data-mode="${mode === 'in' ? 'up' : 'in'}"><i>${mode === 'in' ? 'Me invitaron: crear mi cuenta' : 'Ya tengo cuenta: ingresar'}</i></button>
    </div><p class="lp-foot">Un servicio de TOP Neumáticos</p></div></div>`;
}
function showSpin(t) { $('#app').innerHTML = `<div class="spin">${esc(t || 'Cargando…')}</div>`; }
function showProblem(title, text, retry) {
  $('#app').innerHTML = `<div class="lp"><div class="login"><div class="brand">${LOGO_FULL}</div><div class="panel">
    <h1 style="font-size:30px">${esc(title)}</h1><p class="muted">${esc(text)}</p>
    <div class="row">${retry ? '<button class="btn primary" data-act="retry">Reintentar</button>' : ''}<button class="btn" data-act="logout">Cerrar sesión</button></div></div></div></div>`;
}

async function doAuth(form) {
  const mode = form.dataset.mode, email = $('#a-mail').value.trim(), pass = $('#a-pass').value;
  showSpin(mode === 'in' ? 'Ingresando…' : 'Creando la cuenta…');
  if (mode === 'in') {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) return showLogin({ mode, email, msg: { t: 'err', m: authErr(error) } });
    S.user = data.user; return afterLogin();
  }
  const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) return showLogin({ mode, email, msg: { t: 'err', m: authErr(error) } });
  if (data.session) { S.user = data.user; return afterLogin(); }
  showLogin({ mode: 'in', email, msg: { t: 'ok', m: 'Te mandamos un mail para confirmar la cuenta. Confirmalo y después ingresá.' } });
}

async function afterLogin() {
  showSpin('Cargando tu flota…');
  try {
    try { await sb.rpc('reclamar_invitaciones'); } catch (e) { /* si no hay invitaciones no pasa nada */ }
    const [m, a] = await Promise.all([
      sb.from('miembros').select('*').eq('usuario_id', S.user.id),
      sb.from('acceso_clientes').select('*').eq('usuario_id', S.user.id)
    ]);
    if (m.error) throw m.error;
    if (a.error) throw a.error;
    S.members = m.data; S.access = a.data;
    S.role = m.data.length ? 'staff' : a.data.length ? 'portal' : null;
    if (!S.role) {
      $('#app').innerHTML = `<div class="lp"><div class="login"><div class="brand">${LOGO_FULL}</div><div class="panel">
        <h1 style="font-size:30px">Todavía no tenés acceso</h1>
        <p class="muted">Pedile a TOP Neumáticos que te invite con este mail: <b>${esc(S.user.email)}</b>. Cuando lo haga, volvé a ingresar.</p>
        <div class="row"><button class="btn primary" data-act="retry">Ya me invitaron, reintentar</button><button class="btn" data-act="logout">Cerrar sesión</button></div></div></div></div>`;
      return;
    }
    const ids = [...new Set((S.role === 'staff' ? S.members : S.access).map(x => x.empresa_id))];

/* ---------- Esquema de ejes ---------- */
function bodySvg(v, nAx, top, gap, cab, spineTop, spineBot) {
  const txt = 'font:600 10px var(--f-mono)', ln = 'fill:var(--surface);stroke:var(--ink-3);stroke-width:1.5', soft = 'fill:none;stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:5 4';
  let s = '';
  if (cab) {
    s += `<rect x="152" y="${spineTop}" width="56" height="${spineBot - spineTop}" rx="6" style="${ln}"/>`;
    s += `<line x1="164" y1="${spineTop + 14}" x2="164" y2="${spineBot - 8}" style="stroke:var(--line);stroke-width:2"/><line x1="196" y1="${spineTop + 14}" x2="196" y2="${spineBot - 8}" style="stroke:var(--line);stroke-width:2"/>`;
    if (v.tipo === 'tractor') s += `<circle cx="180" cy="${top + gap * (nAx - 1.5) + 31}" r="23" style="fill:var(--surface-2);stroke:var(--ink-3);stroke-width:1.5"/><path d="M180 ${top + gap * (nAx - 1.5) + 31}l-8 24h16z" style="fill:var(--road)"/>`;
    else s += `<rect x="126" y="${spineTop + 18}" width="108" height="${spineBot - spineTop - 12}" rx="8" style="${soft}"/>`;
    s += `<rect x="104" y="30" width="10" height="24" rx="3" style="${ln}"/><rect x="246" y="30" width="10" height="24" rx="3" style="${ln}"/>`;
    s += `<rect x="116" y="12" width="128" height="66" rx="16" style="${ln}"/><rect x="127" y="20" width="106" height="20" rx="7" style="fill:var(--road);stroke:var(--ink-3);stroke-width:1"/>`;
    s += `<text x="180" y="62" text-anchor="middle" style="${txt};fill:var(--ink-3)">FRENTE</text>`;
  } else {
    const acop = v.tipo === 'acoplado';
    s += `<rect x="128" y="${acop ? 30 : 20}" width="104" height="${spineBot - (acop ? 30 : 20) + 6}" rx="8" style="${ln}"/>`;
    s += `<line x1="146" y1="${acop ? 44 : 34}" x2="146" y2="${spineBot - 6}" style="stroke:var(--line);stroke-width:2"/><line x1="214" y1="${acop ? 44 : 34}" x2="214" y2="${spineBot - 6}" style="stroke:var(--line);stroke-width:2"/>`;
    s += acop ? `<line x1="180" y1="14" x2="180" y2="30" style="stroke:var(--ink-3);stroke-width:4"/><circle cx="180" cy="12" r="5" style="${ln}"/>`

/* dibujo del vehiculo; tireG(code,x,y,w,h,rx,labelY,mmY) devuelve cada posicion */

function friendly(e) {
  const m = errTxt(e);
  if (e && e.code === '23505') {
    if (/instalacion_activa_por_posicion/i.test(m)) return 'Esa posición ya tiene una cubierta montada.';
    if (/instalacion_activa_por_cubierta/i.test(m)) return 'Esa cubierta ya está montada en otro lugar.';
    if (/patente/i.test(m) || /vehiculos/i.test(m)) return 'Esa patente ya está cargada.';
    if (/serie/i.test(m)) return 'Ya existe una cubierta con esa serie.';
    if (/invitaciones/i.test(m)) return 'Ese mail ya tiene una invitación pendiente.';
    return 'Ese dato ya existe.';

}

  });

/* ---------- Scrap: cubiertas dadas de baja ---------- */
function lastInst(c) {
  return [...(S.ix.instByCub[c.id] || [])].filter(i => i.fecha_retiro).sort((a, b) => (a.fecha_retiro < b.fecha_retiro ? 1 : a.fecha_retiro > b.fecha_retiro ? -1 : 0))[0];
}
function scrapList() {
  const q = (S.xq || '').trim().toUpperCase();
  return S.d.cubiertas.filter(c => c.estado === 'descartada' && (!S.xcli || c.cliente_id === S.xcli) &&
    (!S.xmot || (lastInst(c) || {}).motivo_retiro === S.xmot) &&
    (!q || (fmtId(c) + ' ' + (c.serie || '') + ' ' + c.marca + ' ' + (c.modelo || '') + ' ' + c.medida).toUpperCase().includes(q)))
    .sort((a, b) => { const x = (lastInst(a) || {}).fecha_retiro || '', y = (lastInst(b) || {}).fecha_retiro || ''; return x < y ? 1 : x > y ? -1 : 0; });
}
function scrapRows() {
  const staff = isStaff(), rows = scrapList();
  if (!rows.length) return `<tr><td colspan="${staff ? 9 : 8}" class="empty">${S.d.cubiertas.some(c => c.estado === 'descartada') ? 'No hay cubiertas con ese filtro.' : 'Todavía no hay cubiertas dadas de baja. Las que retires por desgaste o daño aparecen acá.'}</td></tr>`;
  return rows.map(c => {
    const ins = lastInst(c), v = ins && S.ix.veh[ins.vehiculo_id], p = ins && S.ix.pos[ins.posicion_id], km = kmTotal(c);
    const ct = costoTotal(c), cost = ct && km > 0 ? `${c.moneda || 'USD'} ${(ct / km * 1000).toFixed(2).replace('.', ',')}` : '—';
    return `<tr${v ? ` class="click" data-act="openveh" data-v="${v.id}" data-code="${esc(p.codigo)}"` : ''}>
      <td class="nolabel"><span class="mono tid">${fmtId(c)}</span></td>
      ${staff ? `<td data-l="Cliente">${esc(S.ix.cli[c.cliente_id]?.razon_social || '—')}</td>` : ''}
      <td data-l="Cubierta">${esc(c.marca)} ${esc(c.modelo || '')}${c.vida > 1 ? ` <span class="pill mute">Vida ${c.vida}</span>` : ''}<br><span class="muted">${esc(c.medida)}${c.serie ? ' · ' + esc(c.serie) : ''}</span></td>
      <td data-l="Baja">${ins ? fdate(ins.fecha_retiro) : '—'}<br><span class="muted">${ins ? esc(motivoLabel(ins.motivo_retiro)) : ''}</span></td>
      <td data-l="Última ubicación">${v ? `${plate(v.patente, true)} <span class="mono">${esc(p.codigo)}</span>` : '—'}</td>
      <td class="r num" data-l="Dibujo final">${mm(lastDepth(c))} mm</td>
      <td class="r num" data-l="Km recorridos">${fmt(km)} km</td>
      <td class="r num" data-l="Cada 1.000 km">${cost}</td></tr>`;
  }).join('');
}
function viewScrap() {
  const staff = isStaff(), all = S.d.cubiertas.filter(c => c.estado === 'descartada');
  const kms = all.map(kmTotal).filter(k => k > 0), avg = kms.length ? Math.round(kms.reduce((a, b) => a + b, 0) / kms.length) : null;
  const costs = all.filter(c => costoTotal(c) && kmTotal(c) > 0).map(c => costoTotal(c) / kmTotal(c) * 1000), avgC = costs.length ? costs.reduce((a, b) => a + b, 0) / costs.length : null;
  const mot = [['', 'Todos'], ['desgaste', 'Desgaste'], ['danio', 'Daño']];
  return `<div class="head"><div><div class="label">${esc(empresa().nombre)}</div><h1>${staff ? 'Scrap de los clientes' : 'Scrap'}</h1></div></div>

/* TOP Flota - cuantificador de perdidas: los 5 "ladrones de km" traducidos a dinero */
const LADRONES = [
  ['alin', 'Alineación incorrecta', 'Desgaste irregular por convergencia/caída fuera de tolerancia.'],
  ['bal', 'Balanceo incorrecto', 'Desgaste en picos o ondulado por ruedas desbalanceadas.'],
  ['pres', 'Control de presión inadecuado', 'Presión fuera de la recomendada, por defecto o por exceso.'],
  ['dis', 'Diseño de banda inadecuado', 'Banda no apta para el eje o el tipo de servicio.'],
  ['emp', 'Emparejamiento incorrecto', 'Duales con diferencia de diámetro o de profundidad.']
];
const REL_DEF = {
  veh: '', neum_veh: 18, analizados: '', con_problemas: '',
  n_alin: 0, n_bal: 0, n_pres: 0, n_dis: 0, n_emp: 0,
  x_alin: 10, x_bal: 10, x_pres: 5, x_dis: 40, x_emp: 10,
  precio_neum: '', precio_litro: '', consumo: '', km_mes: '', vida: 12,
  f_pres: 6, f_alin15: 7, f_alin25: 16, on_pres: 1, on_a15: 0, on_a25: 0
};
const pn = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const money = n => '$ ' + fmt(n);
const pct1 = n => (n * 100).toFixed(1).replace('.', ',') + '%';

/* Motor de calculo: replica la planilla "Cuantificador" (hoja Calculos), paso a paso.
   Los importes corresponden al periodo de vida util del neumatico (por defecto 12 meses). */
function cuantificar(raw) {
  const p = { ...REL_DEF, ...raw };
  const veh = pn(p.veh), nv = pn(p.neum_veh), an = pn(p.analizados), cp = pn(p.con_problemas), vida = pn(p.vida), precio = pn(p.precio_neum);
  if (!(veh > 0 && nv > 0 && an > 0 && vida > 0 && precio > 0)) return null;
  const sumaCasos = LADRONES.reduce((s, [k]) => s + pn(p['n_' + k]), 0);                       // J7
  const items = LADRONES.map(([k, nombre]) => {
    const casos = pn(p['n_' + k]), x = pn(p['x_' + k]) / 100;
    return { k, nombre, casos, x, presente: casos > 0, pctCasos: sumaCasos ? casos / sumaCasos : 0 };   // M2:M6, B2:B6
  });
  const g7 = Math.min(1, cp / an);                                                               // G7: neumaticos con problemas %
  const presentes = items.filter(i => i.presente);
  const d24 = presentes.reduce((s, i) => s + i.x, 0);                                           // D24
  const d25 = presentes.length ? d24 / presentes.length : 0;                                    // D25: promedio de problemas
  const d28 = (1 + d25) * precio, d29 = d28 - precio;                                           // D28, D29
  const d30 = d29 * cp, d31 = d30 / (an / nv), d32 = d31 * veh;                                 // D30, D31, D32
  const g12 = pn(p.consumo) / 100 * pn(p.km_mes) * vida;                                        // G12: litros por vida util
  const d34 = pn(p.precio_litro) * g12;                                                          // D34
  const m = k => items.find(i => i.k === k).pctCasos;
  const dPres = d34 * pn(p.f_pres) / 100 * g7 * m('pres');                                      // D35 - D34
  const dA15 = d34 * pn(p.f_alin15) / 100 * g7 * m('alin');                                     // D36 - D34
  const dA25 = d34 * pn(p.f_alin25) / 100 * g7 * m('alin');                                     // D37 - D34
  const d38 = dPres * (pn(p.on_pres) ? 1 : 0) + dA15 * (pn(p.on_a15) ? 1 : 0) + dA25 * (pn(p.on_a25) ? 1 : 0);
  const d40 = d38 * veh, d43 = d40 + d32, d45 = d43 / precio;
  return {
    items, sumaCasos, g7, d25, d28, d29, d30, d31, d32, d34, dPres, dA15, dA25, d38, d40, d43, d45,
    d46: d45 / vida, mensual: d43 / vida, porVeh: d43 / veh, vida,
    pctCub: d43 ? d32 / d43 : 0, pctComb: d43 ? d40 / d43 : 0,
    muestra: an, flota: veh * nv, cobertura: an / (veh * nv), conProblemas: cp, tieneComb: d34 > 0
  };
}

/* ---------- informe (se usa en pantalla, en el portal y al imprimir) ---------- */
function informe(r, res, p) {
  if (!res) return '<div class="empty">Completá la flota, los neumáticos relevados y el precio del neumático para ver el resultado.</div>';
  const cli = S.ix.cli[r.cliente_id] || {};
  const filas = res.items.map(i => `<tr><td data-l="Ladrón de km"><b>${esc(i.nombre)}</b></td>
      <td class="r num">${fmt(i.casos)}</td><td class="r num">${pct1(i.pctCasos)}</td><td class="r num">${Math.round(i.x * 100)}%</td></tr>`).join('');
  const linea = (t, v, s) => `<tr${s ? ' class="sub"' : ''}><td>${t}</td><td class="r num">${v}</td></tr>`;
  return `<div class="rep">
    <div class="rep-head"><div><div class="label">Informe de pérdidas por kilómetros perdidos</div><h2>${esc(cli.razon_social || '')}</h2><div class="muted">${esc(r.fecha)}${r.asesor ? ' · Asesor: ' + esc(r.asesor) : ''}</div></div></div>
    <div class="kpis"><div class="kpi big"><span>Pérdida total proyectada a la flota</span><b>${money(res.d43)}</b><small>en ${fmt(res.vida)} meses de vida útil · ${money(res.mensual)} por mes</small></div>
      <div class="kpi"><span>Por vehículo</span><b>${money(res.porVeh)}</b><small>en el período</small></div>
      <div class="kpi"><span>Equivale a</span><b>${fmt(res.d45)}</b><small>neumáticos (${res.d46.toFixed(1).replace('.', ',')} por mes)</small></div></div>
    <div class="split"><i style="width:${Math.round(res.pctCub * 100)}%">Neumáticos ${Math.round(res.pctCub * 100)}%</i>${res.pctComb > 0 ? `<i class="b" style="width:${Math.round(res.pctComb * 100)}%">Combustible ${Math.round(res.pctComb * 100)}%</i>` : ''}</div>
    <div class="tablewrap"><table class="rtab"><thead><tr><th>5 ladrones de km</th><th class="r">Casos</th><th class="r">% de casos</th><th class="r">Vida perdida</th></tr></thead><tbody>${filas}</tbody></table></div>
    <div class="tablewrap" style="margin-top:14px"><table class="rtab"><thead><tr><th>Cálculo</th><th class="r">Valor</th></tr></thead><tbody>
      ${linea('Neumáticos con problemas (' + pct1(res.g7) + ' de los relevados)', fmt(res.conProblemas))}
      ${linea('Promedio de problemas', pct1(res.d25))}
      ${linea('Valor que estaría pagando por neumático', money(res.d28))}
      ${linea('Pérdida por neumático', money(res.d29))}
      ${linea('Pérdida de neumáticos con problemas', money(res.d30))}
      ${linea('Pérdida promedio por vehículo', money(res.d31))}
      ${linea('<b>Pérdida en neumáticos proyectada a la flota</b>', '<b>' + money(res.d32) + '</b>', 1)}
      ${res.tieneComb ? linea('Consumo de combustible por vehículo (vida útil)', money(res.d34)) + linea('Pérdida de combustible por vehículo', money(res.d38)) + linea('<b>Pérdida de combustible proyectada a la flota</b>', '<b>' + money(res.d40) + '</b>', 1) : ''}
      ${linea('<b>Total de pérdidas proyectado a la flota</b>', '<b>' + money(res.d43) + '</b>', 1)}</tbody></table></div>
    <p class="muted fine">Base: ${fmt(res.muestra)} neumáticos relevados de ${fmt(res.flota)} de la flota (${pct1(res.cobertura)}); el resultado se proyecta al total de la flota.${res.tieneComb ? ' El consumo extra de combustible se estima con valores de referencia, no se mide.' : ''} Importes en pesos a los precios cargados.</p></div>`;
}

/* ---------- acciones ---------- */
function readRel(r) {
  const p = { ...REL_DEF, ...(r.parametros || {}) };
  document.querySelectorAll('#relform [data-k]').forEach(el => { p[el.dataset.k] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value.trim(); });
  return p;
}
const relOf = id => S.d.relevamientos.find(x => x.id === id);
function liveRel() {
  const f = $('#relform'); if (!f) return;
  const r = relOf(f.dataset.r), p = readRel(r), box = $('#relres');
  if (box) box.innerHTML = informe({ ...r, fecha: $('#rp-fecha').value, asesor: $('#rp-asesor').value }, cuantificar(p), p);
}
async function saveRel(close) {
  const f = $('#relform'), r = relOf(f.dataset.r), p = readRel(r), res = cuantificar(p);
  if (close && !res) return toast('Completá flota, muestra y precio del neumático antes de cerrar.');
  const patch = { parametros: p, fecha: $('#rp-fecha').value || r.fecha, asesor: $('#rp-asesor').value.trim() || null, notas: $('#rp-notas').value.trim() || null };
  if (close) Object.assign(patch, { estado: 'cerrado', resultado: res, cerrado_en: new Date().toISOString() });
  return run(async () => { must(await sb.from('relevamientos').update(patch).eq('id', r.id).select('id')); }, close ? 'Informe publicado para el cliente' : 'Relevamiento guardado');
}
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#relform')) liveRel(); });
document.addEventListener('change', e => { if (e.target.closest && e.target.closest('#relform')) liveRel(); });
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.form === 'relsave') saveRel(false);
  else if (f.dataset.form === 'relnew') {
    run(async () => {
      const row = must(await sb.from('relevamientos').insert({ empresa_id: S.empId, cliente_id: $('#rn-cli').value, fecha: $('#rn-fecha').value, asesor: $('#rn-asesor').value.trim() || null, parametros: { ...REL_DEF } }).select().single());
      S.relId = row.id;
    }, 'Relevamiento creado');
  }
});
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'relopen') { S.relId = a.dataset.r; S.delRel = null; render(); window.scrollTo(0, 0); }
  else if (act === 'relback') { S.relId = null; S.delRel = null; render(); }
  else if (act === 'relprint') window.print();
  else if (act === 'relclose') saveRel(true);
  else if (act === 'relreopen') run(async () => { must(await sb.from('relevamientos').update({ estado: 'abierto', resultado: null, cerrado_en: null }).eq('id', a.dataset.r).select('id')); }, 'Relevamiento reabierto');
  else if (act === 'reldel') {
    if (S.delRel !== a.dataset.r) { S.delRel = a.dataset.r; render(); return; }
    run(async () => { must(await sb.from('relevamientos').delete().eq('id', a.dataset.r).select('id')); S.relId = null; S.delRel = null; }, 'Relevamiento eliminado');
  }
});

/* TOP Flota - estructura de pantalla y eventos */
const ICON = {
  flota: '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  venta: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  alertas: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/>',
  clientes: '<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M16 5.5a3 3 0 0 1 0 5M18 14c2 .7 3 2.3 3 5"/>',
  stock: '<path d="M4 8l8-4 8 4-8 4zM4 8v8l8 4 8-4V8M12 12v8"/>',
  mas: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'
};
const ico = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k] || ''}</svg>`;

function tabsDef() {
  const al = alertList(), n = al.length, bad = al.some(a => a.i.st === 'bad');
  if (S.role === 'staff') {
    return {
      desk: [['flota', 'Flota'], ['stock', 'Stock'], ['scrap', 'Scrap'], ['venta', 'Nueva venta'], ['alertas', 'Alertas', n, bad], ['clientes', 'Clientes'], ['cuant', 'Cuantificador'], ['rend', 'Rendimiento'], ['equipo', 'Equipo']],
      mob: [['flota', 'Flota'], ['venta', 'Venta'], ['alertas', 'Alertas', n, bad], ['clientes', 'Clientes'], ['mas', 'Más']]
    };
  }
  return { desk: [['flota', 'Mi flota'], ['stock', 'Stock'], ['scrap', 'Scrap'], ['alertas', 'Alertas', n, bad], ['cuant', 'Informes']], mob: [['flota', 'Mi flota'], ['stock', 'Stock'], ['alertas', 'Alertas', n, bad], ['mas', 'Más']] };
}
function render() {
  if (!S.user || !S.role) return;
  const t = tabsDef(), views = { flota: viewFlota, venta: viewVenta, alertas: viewAlertas, clientes: viewClientes, rend: viewRend, equipo: viewEquipo, mas: viewMas, stock: viewStock, scrap: viewScrap, cuant: viewCuant, addveh: viewAddVeh };
  if (![...t.desk, ...t.mob].some(x => x[0] === S.tab) && S.tab !== 'addveh') S.tab = 'flota';
  const cur = S.tab === 'addveh' ? 'flota' : S.tab;
  const emp = S.empresas.length > 1
    ? `<select id="emp" aria-label="Empresa">${S.empresas.map(e => `<option value="${e.id}"${e.id === S.empId ? ' selected' : ''}>${esc(e.nombre)}</option>`).join('')}</select>`
    : `<span>${esc(empresa().nombre)}</span>`;
  const pillOf = x => (x[2] ? `<span class="pill ${x[3] ? 'bad' : 'warn'}">${x[2]}</span>` : '');
  const mobSel = x => x[0] === (S.tab === 'addveh' ? 'flota' : S.tab) || (x[0] === 'mas' && ['rend', 'equipo', 'scrap', 'cuant'].includes(S.tab));
  $('#app').innerHTML = `<header class="top"><div class="in"><div class="brand">${LOGO_FULL}</div>
    <div class="who">${emp}<span class="mail">${esc(S.user.email)}</span><button class="btn small out" data-act="logout">Salir</button></div></div></header>
    <div class="tabsbar"><nav class="tabs in" role="tablist">${t.desk.map(x => `<button class="tab" role="tab" aria-selected="${x[0] === cur}" data-tab="${x[0]}">${x[1]}${pillOf(x)}</button>`).join('')}</nav></div>
    <main>${views[S.tab]()}</main>
    <nav class="bottombar">${t.mob.map(x => `<button role="tab" aria-selected="${mobSel(x)}" data-tab="${x[0]}">${ico(x[0])}${x[1]}${pillOf(x)}</button>`).join('')}</nav>`;
  if (S.tab === 'venta') { posList(); }
  if (S.tab === 'addveh') { drawPreview(); }
  S.prefCli = null;
}
const renderMain = render;

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const tabEl = e.target.closest('[data-tab]');
  if (tabEl) { S.tab = tabEl.dataset.tab; S.vehId = null; S.recapId = null; S.relId = null; render(); window.scrollTo(0, 0); return; }
  const pk = e.target.closest('[data-pos]');
  if (pk) { const cb = document.querySelector(`#poslist [name=pos][value="${pk.dataset.pos}"]`); if (cb) { cb.checked = !cb.checked; drawSketch(); } return; }
  const g = e.target.closest('[data-code]');
  if (g && S.vehId) { S.code = g.dataset.code; const v = S.ix.veh[S.vehId]; $('.diagram').innerHTML = diagram(v); $('#tirepanel').innerHTML = tirePanel(v); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'openveh') { openVeh(a.dataset.v); if (a.dataset.code) S.code = a.dataset.code; S.tab = 'flota'; render(); window.scrollTo(0, 0); }
  else if (act === 'allpos' || act === 'nopos') { document.querySelectorAll('#poslist [name=pos]').forEach(c => { c.checked = act === 'allpos'; }); drawSketch(); }
  else if (act === 'back') { S.vehId = null; render(); }
  else if (act === 'msg') { S.msg = buildMsg(a.dataset.i); $('#msgbox').innerHTML = msgBox(); }
  else if (act === 'copymsg') {
    $('#msgtxt').select();
    (navigator.clipboard ? navigator.clipboard.writeText(S.msg) : Promise.reject()).then(() => toast('Mensaje copiado'), () => toast('Mensaje seleccionado: copialo manualmente.'));
  }
  else if (act === 'authmode') showLogin({ mode: a.dataset.mode });
  else if (act === 'retry') { if (S.user) afterLogin(); else boot(); }
  else if (act === 'logout') logout();
  else if (act === 'salecli') { S.prefCli = a.dataset.c; S.tab = 'venta'; render(); window.scrollTo(0, 0); }
  else if (act === 'invitecli') { S.prefCli = a.dataset.c; S.tab = 'equipo'; render(); window.scrollTo(0, 0); }
  else if (act === 'recap') { S.recapId = a.dataset.c; render(); window.scrollTo(0, 0); }
  else if (act === 'norecap') { S.recapId = null; S.relId = null; render(); }
  else if (act === 'delstock') { const id = a.dataset.c; if (S.delArm === id) deleteStock(id); else { S.delArm = id; $('#srows').innerHTML = stockRows(); toast('Tocá de nuevo para eliminarla'); } }
  else if (act === 'delinv') deleteInvite(a.dataset.i);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-code],[data-pos]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; $('#rows').innerHTML = vehRows(); }
  if (e.target.id === 'xq') { S.xq = e.target.value; $('#xrows').innerHTML = scrapRows(); }
  if (e.target.id === 'sq') { S.sq = e.target.value; $('#srows').innerHTML = stockRows(); }
});
document.addEventListener('change', e => {
  const id = e.target.id, val = e.target.value;
  if (e.target.name === 'pos') drawSketch();
  else if (id === 'emp' || id === 'emp2') changeEmpresa(val);
  else if (id === 'xmot' || id === 'xcli') { S[id] = val; $('#xrows').innerHTML = scrapRows(); }
  else if (id === 'sest' || id === 'scli') { S[id] = val; $('#srows').innerHTML = stockRows(); }
  else if (id === 'ms-c') { const o = e.target.selectedOptions[0]; $('#ms-prof').value = mm(Number(o.dataset.d)); }
  else if (id === 'v-tipo') { $('#v-conf').value = DEF_CONFIG[val] || '6x2'; drawPreview(); }
  else if (id === 'v-conf') drawPreview();
  else if (id === 'clif') { S.cli = val; $('#rows').innerHTML = vehRows(); }
  else if (id === 'trab') { S.trab = val; render(); }
  else if (id === 's-tipo') { $('#s-conf').value = DEF_CONFIG[val] || '6x2'; posList(); }
  else if (id === 's-conf') posList();
  else if (id === 's-cli') { const n = val === '__new'; $('#newcli').hidden = !n; $('#newtel').hidden = !n; }
  else if (id === 'n-tipo') { $('#n-rolf').hidden = val !== 'personal'; $('#n-clif').hidden = val !== 'cliente'; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'authform') return doAuth(f);
  const k = f.dataset.form;
  if (k === 'insp') saveInspection(f);
  else if (k === 'retire') retireTire(f);
  else if (k === 'mount') mountTire(f);
  else if (k === 'mountstock') mountFromStock();
  else if (k === 'stock') addStock();
  else if (k === 'recap') recapReturn();
  else if (k === 'veh') createVehicle();
  else if (k === 'sale') createSale(f);
  else if (k === 'client') createClient(f);
  else if (k === 'invite') createInvite(f);
});
boot();


</script>
</body>
</html>
